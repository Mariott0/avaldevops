name: hardening-devops

services:
  api:
    build: ./api
    container_name: backend_api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:-segredo-didatico-kanban-troque-em-producao-2026}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [app]

  frontend:
    build: ./frontend
    container_name: frontend_nginx
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

volumes:
  sqlite_data:

networks:
  app:
